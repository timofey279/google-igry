{% extends "base.html" %}

{% block content %}

<h2>Игры</h2>

<form method="get" action="/">
    <input type="text" name="q" placeholder="Поиск игр...">
    <button type="submit">Найти</button>
</form>

{% for game in games %}
    <div class="game-card">
        <h3>{{ game.title }}</h3>
        <a href="/play/{{ game.id }}" class="play.btn">Играть</a>
    </div>
{% endfor %}

{% endblock %}
