{% extends "base.html" %}

{% block content %}

<h2>Мои игры</h2>

{% for game in games %}
    <div class="game-card">
        <h3>{{ game.title }}</h3>

        <a href="/play/{{ game.id }}" class="play.btn">Играть</a>
        <a href="/delete/{{ game.id }}" onclick="return confirm('Удалить игру?')">
            Удалить
        </a>
    </div>
{% endfor %}

{% if games|length == 0 %}
    <p>У вас пока нет игр</p>
{% endif %}

{% endblock %}
